name: Docker meta test

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
  # Rebuild the latest release weekly so the image picks up Chromium and Debian security fixes
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-images:
    if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'schedule' || github.repository == 'pleasantone/FlareSolverr') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Find latest release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo RELEASE_TAG=$(gh release view --repo FlareSolverr/FlareSolverr --json tagName --jq .tagName) >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Downcase repo
        run: echo REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]') >> $GITHUB_ENV

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REPOSITORY }},enable=${{ github.event_name != 'pull_request' }}
            ghcr.io/${{ env.REPOSITORY }}
          tags: |
            type=semver,pattern={{version}},prefix=v,value=${{ env.RELEASE_TAG }}
            type=ref,event=pr
          flavor: |
            latest=auto

      - name: Show result
        run: |
          echo "event=${{ github.event_name }} RELEASE_TAG=${{ env.RELEASE_TAG }} head=$(git rev-parse HEAD) describe=$(git describe --tags --always)"
          echo "TAGS:"; echo "${{ steps.docker_meta.outputs.tags }}"
          echo "LABELS:"; echo "${{ steps.docker_meta.outputs.labels }}"
